<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Set password · GlobalBQS test</title>
<link rel="stylesheet" href="style.css?v=1.0.0">
<script src="config.js?v=1.0.0"></script>
</head>
<body>
<div class="banner">TEST ENVIRONMENT (DEMO) · NOT FOR CLIENTS</div>
<header><div class="wrap"><span class="brand">GlobalBQS</span><span class="sub">Test environment</span></div></header>
<main><div class="wrap">
  <div class="card">
    <h1>Set your password</h1>
    <p class="muted" id="who">Checking your link…</p>
    <form id="f" style="display:none" autocomplete="off">
      <label for="p1">New password (at least 8 characters)</label>
      <input id="p1" type="password" autocomplete="new-password" minlength="8" required>
      <label for="p2">Repeat password</label>
      <input id="p2" type="password" autocomplete="new-password" minlength="8" required>
      <button id="b" type="submit">Set password</button>
    </form>
    <div id="m" class="msg"></div>
  </div>
  <div class="card" id="next" style="display:none">
    <h2>Next step</h2>
    <p>Sign in with this account in the portal preview (WeWeb editor, runs on the demo), or use the <a href="./#signin">sign-in check</a> on the test start page.</p>
  </div>
</div></main>
<footer>GlobalBQS · test environment · demo data only</footer>
<script>
(async () => {
  const q = gbqsAuthParams();
  const who = document.getElementById('who'), f = document.getElementById('f'), m = document.getElementById('m');
  const show = (cls, t) => { m.className = 'msg ' + cls; m.textContent = t; };
  const token = q.access_token || '';
  // Remove the token from the address bar
  history.replaceState(null, '', location.pathname);
  if (q.error || q.error_description) { who.textContent = ''; show('err', q.error_description || q.error); return; }
  if (!token) { who.textContent = ''; show('err', 'This link has expired or was already used.'); return; }
  const r = await gbqsFn('portal-set-password', { access_token: token, check: true });
  if (!r.data || !r.data.ok) { who.textContent = ''; show('err', (r.data && r.data.message) || 'This link has expired or was already used.'); return; }
  who.textContent = 'Account: ' + r.data.email + (q.type ? ' · link type: ' + q.type : '');
  f.style.display = 'block';
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
    if (p1.length < 8) return show('err', 'Use at least 8 characters.');
    if (p1 !== p2) return show('err', 'The passwords do not match.');
    const b = document.getElementById('b'); b.disabled = true; show('info', 'Saving…');
    const s = await gbqsFn('portal-set-password', { access_token: token, password: p1 });
    if (s.data && s.data.ok) { f.style.display = 'none'; show('ok', s.data.message); document.getElementById('next').style.display = 'block'; }
    else { b.disabled = false; show('err', (s.data && s.data.message) || 'Your password could not be set.'); }
  });
})();
</script>
</body>
</html>
